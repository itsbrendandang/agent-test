[package]
name = "drug-board"
version = "0.1.0"
description = "Drug Board desktop dashboard"
authors = ["Brendan Dang"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["apple-native"] }
ureq = "3"

# The mock runtime, for the access-control tests in src/lib.rs. Test builds only.
[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

# Small, fast release binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
