# The whole platform in containers:  docker compose up --build
#   dashboard  http://localhost:5317      engine  http://localhost:8787
# CLI in the container:  docker compose run --rm engine npm run doctor
#
# The repo is mounted at its host path so the sandboxes the engine starts (through the host's Docker)
# can mount run folders. Run this from the repo root. Run the engine here or on the host, not both.
name: glhf
services:
  engine:
    build:
      context: .
      args:
        # The dashboard calls the engine at this address, fixed at build time. It follows GLHF_ENGINE_PORT,
        # so after a port change run `docker compose up --build` once.
        VITE_ENGINE_URL: http://localhost:${GLHF_ENGINE_PORT:-8787}
    image: glhf-platform
    # A small init process is pid 1 and the engine its child: signals from `docker compose down` reach the
    # engine (which then releases its run locks), and processes it leaves behind are cleaned up.
    init: true
    working_dir: ${PWD}
    command: ["node", "engine/src/server.ts"]
    ports:
      - "127.0.0.1:${GLHF_ENGINE_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container the engine must listen on all interfaces to be reachable through the
      # published port; the port above is published to 127.0.0.1 only, so it stays local to this machine.
      HOST: 0.0.0.0
      # The dashboard's address as the browser sees it. Change it if you change GLHF_DASHBOARD_PORT.
      DASHBOARD_ORIGINS: http://localhost:${GLHF_DASHBOARD_PORT:-5317},http://127.0.0.1:${GLHF_DASHBOARD_PORT:-5317}
    volumes:
      - ${PWD}:${PWD}
      - engine_modules:${PWD}/engine/node_modules
      - bixbench_venv:${PWD}/glhf/bixbench/.venv
      # Required: the engine starts the agents' sandbox containers through the host's Docker. This gives
      # the engine container control of the host's Docker (root-equivalent), so run only code you trust
      # in it and never publish the engine port beyond 127.0.0.1. The engine runs as root for this reason:
      # the socket belongs to root, and whoever can use it is root-equivalent with or without the name.
      - /var/run/docker.sock:/var/run/docker.sock
  dashboard:
    image: glhf-platform
    depends_on: [engine]
    init: true
    # Serves static files only: no root, no Docker socket, no repo mount.
    user: node
    entrypoint: []
    command: ["node", "/srv/serve.mjs"]
    ports:
      - "127.0.0.1:${GLHF_DASHBOARD_PORT:-5317}:5317"
volumes:
  engine_modules:
  bixbench_venv:
