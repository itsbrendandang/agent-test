[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bixbench-v1"
version = "0.1.0"
description = "GLHF adapter for the public BixBench v1.5 question-answering benchmark: single agent vs swarm, local Docker."
readme = "README.md"
requires-python = ">=3.12"
# bixbench3 pins inspect-ai, the model SDKs and pydantic; this package adds nothing to them.
dependencies = ["bixbench3", "huggingface-hub"]

[project.scripts]
bixbench-v1 = "bixbench_v1.cli:main"

[tool.uv.sources]
bixbench3 = { path = "../bixbench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/bixbench_v1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/bixbench_v1"]

[[tool.mypy.overrides]]
# bixbench3 ships no py.typed marker; its own mypy run checks it.
module = ["inspect_ai.*", "huggingface_hub.*", "bixbench3.*", "modal.*", "inspect_sandboxes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = ["mypy", "pytest", "ruff", "types-pyyaml"]
# Opt-in: only `--sandbox modal` needs these (`uv run --group modal ...`). Pinned exactly: the
# provider in modal_sandbox.py subclasses inspect-sandboxes' Modal provider and calls two of its
# private helpers. inspect-sandboxes 0.6.1 does not import with modal 1.6.2 or later (it reads
# modal.sandbox.ARG_MAX_BYTES, which moved), so the client here is 1.6.1, not the 1.6.4 of the
# `modal` command line tool. Both talk to the same Modal account.
modal = ["inspect-sandboxes==0.6.1", "modal==1.6.1"]
