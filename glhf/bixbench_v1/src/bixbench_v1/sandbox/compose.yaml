# Agent sandbox for BixBench v1.5 runs.
#   - no network (network_mode: none);
#   - /data is the staged capsule data, read-only (see bixbench_v1/staging.py for what is staged);
#   - /outputs receives answers.json, METHODS.md and the ledger, written by the solver's code.
# Nothing else from the host is mounted: the answer key, the capsule zip and the solution notebooks
# stay on the host. tests/test_boundary.py checks this file.
services:
  default:
    image: ${BIXBENCH_V1_IMAGE:-futurehouse/bixbench:aviary-notebook-env}
    x-local: true
    init: true
    working_dir: /home
    command: ["sleep", "infinity"]
    network_mode: none
    volumes:
      - ${BIXBENCH_V1_DATA_DIR:?staged capsule data directory is required}:/data:ro
      - ${BIXBENCH_V1_OUTPUTS_DIR:?outputs directory is required}:/outputs
