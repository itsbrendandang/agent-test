    license: "other (Kimi K3 License)"
    weights_gb: 1560.9
    context_length: 1048576
    tool_call_parser: kimi_k3
    reasoning_parser: kimi_k3
    notes: >-
      Same size as K3.1 Pro (2.8T parameters), so the same answer. Modal Shared Endpoint price:
      3.00 / 0.30 cached / 15.00 USD per million tokens. Older and smaller: Kimi K2.6 (1.03T
      parameters, 595 GB; nvidia/Kimi-K2.6-NVFP4 is the same size on disk), still 3 B300 or more.

