# The model registry of the open-model grid. Checked by `uv run openmodels models` and by tests.
# status: smoke-tested (served and ran one capsule with both solvers), served (answered the key
# and tool-call checks), prepared (a vendor model: addressed, priced, never run by an agent),
# waiting (needs an app file or an owner decision), not-deployed (decided against, see notes).

prices:
  # Read on 2026-11-14 with `modal billing rates` (the command prints the rates of this
  # workspace; the same figures as modal.com/pricing). USD.
  read_from: "modal billing rates, 2026-11-14 (same figures as modal.com/pricing)"
  gpu_per_hour:
    T4: 0.59
    L4: 0.80
    A10G: 1.10
    L40S: 1.95
    A100-40GB: 2.10
    A100-80GB: 2.50
    RTX-PRO-6000: 3.03
    H100: 3.95
    H200: 4.54
    B200: 6.25
    B300: 7.10
  cpu_core_per_hour: 0.0473
  memory_gib_per_hour: 0.008
  volume_gib_per_month: 0.09

models:
  # ---- the three contestants ------------------------------------------------------------------
  - name: qwen3.6-35b-a3b
    kind: modal-app
    status: smoke-tested
    inspect_model: openai-api/openmodels/Qwen/Qwen3.6-35B-A3B-FP8
    hf_repo: Qwen/Qwen3.6-35B-A3B-FP8
    revision: c653bba46dfa06e9658dcc0b0dc87fe4685f14a2
    gated: false
    license: apache-2.0
    weights_gb: 37.5
    app_file: apps/qwen36_35b_a3b.py
    app_name: openmodels-qwen36-35b-a3b
    gpu: L40S
    gpu_count: 1
    cpu: 4
    memory_gib: 32
    price_per_second: 0.000665   # (1.95 + 4 x 0.0473 + 32 x 0.008) / 3600 = 2.395 USD an hour
    startup_timeout_seconds: 1200
    scaledown_seconds: 300
    context_length: 131072
    max_output_tokens: 16384
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    notes: >-
      Smoke-tested 2026-11-14 on one L40S (48 GB) with the 131,072-token context: it fits.
      First cold start 285 s; 105 output tokens a second; a real tool-call round trip works
      (parsed call, right value, text answer after the tool result). One capsule (bix-46, 2
      questions): single agent 54 s and 187,051 tokens; swarm 144 s and 326,262 tokens; all four
      answers graded correct by code rules. Grid (20 capsules, 82 questions, both solvers):
      40 of 40 runs done in 9,228 s, 6.14 USD; see README. 35B parameters, 3B active; thinking on.
      Modal's own example serves it with SGLang on 2 H100 (7.90 USD an hour) for low latency;
      one L40S (1.95) is the cheapest Modal GPU that holds it.

  - name: claude-opus-5-5
    kind: api
    status: prepared
    inspect_model: anthropic/claude-opus-5-5
    context_length: 1000000
    usd_per_mtok:
      input: 4.0
      cached_input: 0.2
      cache_write: 5.0
      output: 20.0
      source: "engine/node_modules/@earendil-works/pi-ai/dist/providers/data/anthropic.json (pi-ai 1.5.2), id claude-opus-5-5; board/config.yaml line 52 says the same 4 / 20"
    notes: Paid vendor model on the owner's key. Never run by an agent.

  - name: gpt-6.1-sol
    kind: api
    status: prepared
    inspect_model: openai/gpt-6.1-sol
    context_length: 272000
    usd_per_mtok:
      input: 2.0
      cached_input: 0.1
      cache_write: 2.5
      output: 10.0
      source: "engine/node_modules/@earendil-works/pi-ai/dist/providers/data/openai.json (pi-ai 1.5.2), id gpt-6.1-sol; a higher tier (4 / 0.2 / 15) applies above 272,000 input tokens, which a run here cannot reach"
    notes: >-
      Paid vendor model on the owner's key. Never run by an agent. "OpenAI Sol" is read as the
      newest Sol id: the pi-ai model table lists gpt-5.6-sol, gpt-6-sol and gpt-6.1-sol, and
      6.1 is the highest version (the table has no release dates).

  # ---- Kimi: looked at, not deployed ----------------------------------------------------------
  - name: kimi-k3.1-pro
    kind: not-deployed
    status: not-deployed
    hf_repo: moonshotai/Kimi-K3.1-Pro
    revision: d9e99b0792a5e93b78ea9bea62a68167e36ddd9e
    gated: false
    license: "other (Kimi K3.1 Pro License)"
    weights_gb: 1561.3
    context_length: 1048576
    tool_call_parser: kimi_k3
    reasoning_parser: kimi_k3
    notes: >-
      2.8 trillion parameters (104B active), released already quantised (MXFP4 weights). vLLM's
      recipe needs 1,874 GB of GPU memory and a nightly vLLM (0.34): at least 7 B300 (288 GB
      each), 49.70 USD an hour, over the 10 USD an hour limit. Not self-served. Hosted paths:
      kimi-k3.1-pro-tinker and kimi-k3.1-pro-moonshot below, or Modal's Shared Endpoint for this
      model (2.00 / 0.20 cached / 10.00 USD per million tokens; plan credit cannot pay for it;
      it needs `modal endpoint create --shared`, which was not done). See README.

  - name: kimi-k3
    kind: not-deployed
    status: not-deployed
    hf_repo: moonshotai/Kimi-K3
    revision: f831ab66814297da540d832a5235f8e904f29d06
    gated: false
    license: "other (Kimi K3 License)"
    weights_gb: 1560.9
    context_length: 1048576
    tool_call_parser: kimi_k3
    reasoning_parser: kimi_k3
    notes: >-
      Same size as K3.1 Pro (2.8T parameters), so the same answer. Modal Shared Endpoint price:
      3.00 / 0.30 cached / 15.00 USD per million tokens. Older and smaller: Kimi K2.6 (1.03T
      parameters, 595 GB; nvidia/Kimi-K2.6-NVFP4 is the same size on disk), still 3 B300 or more.

  # ---- hosted open models: prepared, never run ------------------------------------------------
  - name: kimi-k3.1-pro-tinker
    kind: api
    status: prepared
    provider: tinker
    inspect_model: openai-api/tinker/moonshotai/Kimi-K3.1-Pro:peft:262144
    base_url: https://tinker.thinkingmachines.dev/services/tinker-prod/oai/api/v1
    base_url_env: TINKER_BASE_URL
    api_key_env: TINKER_API_KEY
    context_length: 262144
    usd_per_mtok:
      input: 6.0
      cached_input: 1.2
      output: 25.0
      source: "tinker-docs.thinkingmachines.ai/tinker/models.json, read 2026-11-14 (prefill 6.00, cached prefill 1.20, sample 25.00)"
    notes: >-
      Kimi as the fourth contestant, hosted on Tinker (the owner has Tinker credits). NOT VERIFIED,
      and needs one small paid request to find out: (1) Tinker's OpenAI-compatible endpoint is
      documented with a checkpoint path as the model name; that it takes this base-model id is not
      stated. (2) Its docs do not mention `tools` on that endpoint (tool use is documented only on
      the Anthropic-compatible one, which Inspect 0.3.220 cannot address with this model name).
      (3) The docs do not say that credits pay for sampling. Check with `openmodels toolcheck`.

  - name: kimi-k3.1-pro-moonshot
    kind: api
    status: prepared
    provider: moonshot
    inspect_model: openai-api/moonshot/kimi-k3.1-pro
    base_url: https://api.moonshot.ai/v1
    base_url_env: MOONSHOT_BASE_URL
    api_key_env: MOONSHOT_API_KEY
    context_length: 1048576
    usd_per_mtok:
      input: 2.0
      cached_input: 0.2
      output: 10.0
      source: "engine/node_modules/@earendil-works/pi-ai/dist/providers/data/moonshotai.json (pi-ai 1.5.2), id kimi-k3.1-pro; Moonshot's own pricing page shows no numbers without a browser"
    notes: >-
      Kimi on Moonshot's own API (platform.kimi.ai). Needs a key from the owner; real money.
      Tool calls are documented there. The model card says the whole assistant message, with its
      reasoning content, must be sent back each turn; whether Inspect does that was not checked.

  - name: qwen3.6-35b-a3b-tinker
    kind: api
    status: prepared
    provider: tinker
    inspect_model: openai-api/tinker/Qwen/Qwen3.6-35B-A3B:peft:262144
    base_url: https://tinker.thinkingmachines.dev/services/tinker-prod/oai/api/v1
    base_url_env: TINKER_BASE_URL
    api_key_env: TINKER_API_KEY
    context_length: 262144
    usd_per_mtok:
      input: 0.45
      cached_input: 0.09
      output: 1.335
      source: "tinker-docs.thinkingmachines.ai/tinker/models.json, read 2026-11-14 (prefill 0.45, cached prefill 0.09, sample 1.335)"
    notes: >-
      The same model as the Modal contestant, hosted on Tinker (full-precision weights there, FP8
      on Modal). A second path only: the Modal one is smoke-tested. Same three unknowns as
      kimi-k3.1-pro-tinker.

