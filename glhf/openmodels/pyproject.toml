[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmodels"
version = "0.1.0"
description = "Open models served on Modal GPUs for the BixBench v1 grid: registry, cost ledger and guard, grid runner."
readme = "README.md"
requires-python = ">=3.12"
# bixbench-v1 brings the paid-calls guard and the harness command; httpx and pyyaml come with it.
dependencies = ["bixbench-v1", "httpx", "pyyaml"]

[project.scripts]
openmodels = "openmodels.cli:main"

[tool.uv.sources]
bixbench-v1 = { path = "../bixbench_v1", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/openmodels"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = ["pytest", "ruff"]
